<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050c12"><title>Ballkaster | Field Deck</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050c12;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #d8ff9a;outline-offset:3px}.shell{position:relative;isolation:isolate;height:100dvh;min-height:520px;overflow:hidden;background:#07131d}.world{position:absolute;inset:0;background:radial-gradient(ellipse at 52% 37%,#2b4b53 0,#0d2931 29%,#061621 65%,#02080e 100%)}.world:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0009,transparent 35%,#0008 95%),repeating-linear-gradient(90deg,transparent 0 110px,#d2e8e409 111px),repeating-linear-gradient(0deg,transparent 0 100px,#d2e8e406 101px);transform:perspective(500px) rotateX(32deg) scale(1.5);opacity:.7}.field{position:absolute;left:-15%;right:-15%;bottom:0;height:46%;background:linear-gradient(180deg,transparent,#0b3d36 55%,#071b1a);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);opacity:.7}.field:after{content:"";position:absolute;inset:15% 8% 0;border:2px solid #a6e7c125;border-radius:50% 50% 0 0}.ambient{position:absolute;top:9%;left:20%;width:60%;height:45%;border-radius:50%;background:#9edac522;filter:blur(70px)}.machine{position:absolute;top:24%;left:50%;width:min(70vw,550px);height:min(47vh,420px);transform:translateX(-50%);filter:drop-shadow(0 35px 25px #000b);transition:transform .35s}.machine .wheel{position:absolute;top:9%;width:37%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#0d151b 0 12%,#b0c2bf 13% 15%,#1b333b 16% 23%,#060c10 24% 51%,#253943 52% 58%,#05090b 59% 70%,#708a8b 71% 73%,#101c21 74%);border:3px solid #5d797e;box-shadow:inset 0 0 22px #000,0 0 0 7px #09141b,0 12px 30px #000c}.machine .wheel:after{content:"";position:absolute;inset:26%;border-radius:50%;border:2px dashed #648d94}.wheel.left{left:10%}.wheel.right{right:10%}.machine .body{position:absolute;left:28%;top:35%;width:44%;height:23%;background:linear-gradient(150deg,#829d9c,#1e3e49 23%,#07151d 65%,#466f79);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);box-shadow:0 10px 20px #000}.machine .body:after{content:"BK / 01";position:absolute;bottom:8%;left:37%;color:#b7e1d8;font-size:11px;letter-spacing:2px;font-weight:900}.machine .stand{position:absolute;left:47%;top:55%;width:6%;height:35%;background:linear-gradient(90deg,#263c43,#a2bbb8 45%,#1b323a);transform:perspective(100px) rotateX(10deg)}.machine .stand:after{content:"";position:absolute;left:-145%;bottom:-3%;width:390%;height:14%;background:#253c42;border-radius:50%}.machine .ball{position:absolute;left:50%;top:25%;width:9%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#c7d6d5 55%,#708f95);box-shadow:0 0 24px #d5ffde70;transform:translateX(-50%)}.flight{position:absolute;inset:0;pointer-events:none}.flight svg{width:100%;height:100%;overflow:visible}.flight path{fill:none;stroke:#d2ff91;stroke-width:2;stroke-dasharray:5 11;filter:drop-shadow(0 0 7px #baff7c)}.topbar{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 12px}.brand{font-size:14px;font-weight:900;letter-spacing:3px}.brand span{font-weight:400;color:#baff8d}.link{font-size:10px;letter-spacing:1px;color:#c5d4cf}.link i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ffad6b;margin-right:6px}.stage-label{position:absolute;top:21%;left:20px;z-index:2;font-size:10px;letter-spacing:2px;color:#afc9c7}.stage-label strong{display:block;color:#f5fff9;font-size:clamp(21px,4vw,39px);letter-spacing:-1px;margin-top:8px;font-weight:700}.deck{position:absolute;z-index:4;bottom:0;left:0;right:0;background:linear-gradient(180deg,#111c21ed,#071015f8);border-top:1px solid #55706b;border-radius:27px 27px 0 0;padding:13px 18px max(13px,env(safe-area-inset-bottom));box-shadow:0 -25px 75px #0008;backdrop-filter:blur(25px)}.grip{width:35px;height:4px;border-radius:4px;background:#6b8683;margin:0 auto 13px}.deck-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.deck-head b{font-size:10px;letter-spacing:2px;color:#a6bcb7}.deck-head span{font-size:11px;color:#b7ff8c;font-weight:900}.tuning{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.dial{text-align:center;min-width:0}.dial label{display:block;color:#b1c3bd;font-size:10px;letter-spacing:1px;margin-bottom:7px}.dial .reading{font-size:clamp(23px,5vw,36px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}.dial .reading small{font-size:11px;color:#a1bbb2}.dial input{width:100%;accent-color:#baff8c;margin-top:10px;height:22px}.dial:nth-child(2){border-inline:1px solid #344944;padding-inline:9px}.quick{display:flex;gap:7px;margin-top:12px}.quick button{flex:1;border:1px solid #344b45;background:#1b2a2a;color:#bfd1c9;border-radius:30px;padding:9px 3px;font-size:11px;font-weight:750}.quick button.active{background:#d0ff9c;border-color:#d0ff9c;color:#122017}.commands{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.commands button{border:0;border-radius:13px;padding:16px 5px;font-size:16px;letter-spacing:1px;font-weight:900}.go{background:#d0ff9c;color:#0c2414}.halt{background:#ef766b;color:#260c0c}.foot{font-size:10px;color:#9db0a9;text-align:center;margin-top:10px}.foot.running{color:#d0ff9c}.details{position:absolute;right:20px;top:21%;z-index:3;color:#b9e4d7;font-size:10px;text-align:right;line-height:2}.details b{font-size:16px;color:white}.mobile-hint{display:none}
@media(min-width:850px){.deck{left:auto;width:420px;top:90px;bottom:24px;right:24px;border:1px solid #55706b;border-radius:23px;display:flex;flex-direction:column;justify-content:center}.world{right:320px}.machine{left:37%;top:24%;width:440px;height:380px}.stage-label{top:18%;left:4%}.details{right:450px}.deck .tuning{grid-template-columns:1fr}.dial{display:grid;grid-template-columns:100px 1fr;align-items:center;text-align:left;margin-bottom:14px}.dial label{grid-column:1/-1}.dial input{grid-column:2;margin:0}.dial:nth-child(2){border:0;padding:0}.dial .reading{font-size:28px}.deck-head{margin-bottom:25px}.commands{margin-top:25px}.quick{margin-top:25px}.grip{display:none}}
@media(max-width:849px){.machine{top:17%;width:min(73vw,420px);height:min(40vh,320px)}.stage-label{top:13%}.details{top:14%}}
@media(max-height:700px) and (max-width:849px){.deck{padding-top:8px}.grip{margin-bottom:6px}.deck-head{margin-bottom:8px}.dial label{margin-bottom:2px}.dial input{margin-top:4px}.quick{margin-top:7px}.quick button{padding:6px 2px}.commands{margin-top:8px}.commands button{padding:10px}.foot{margin-top:5px}.machine{top:14%;width:min(54vw,330px)}}
@media(max-width:370px){.deck{padding-inline:11px}.stage-label{left:12px}.details{right:12px}.brand{font-size:12px}.dial label{font-size:9px}}
</style></head><body><div class="shell"><div class="world"><div class="ambient"></div><div class="field"></div></div><header class="topbar"><div class="brand">BALLKASTER <span> / FIELD DECK</span></div><div class="link"><i></i>OFFLINE · DEMO</div></header><div class="stage-label">KASTESYSTEM / 01<strong id="shot">Rett skudd</strong></div><div class="details">VENSTRE <b id="leftRead">35%</b><br>HØYRE <b id="rightRead">35%</b><br>ROTASJON <b id="angleRead">0°</b></div><div class="machine" id="machine"><div class="stand"></div><div class="body"></div><div class="wheel left"></div><div class="wheel right"></div><div class="ball" id="ball"></div></div><div class="flight"><svg viewBox="0 0 400 750" preserveAspectRatio="none"><path id="path" d="M200 270 Q210 165 330 120"/></svg></div><section class="deck"><div class="grip"></div><div class="deck-head"><b>UTSKYTNING / KONTROLL</b><span id="mode">MANUELL</span></div><div class="tuning"><div class="dial"><label for="left">VENSTRE HJUL</label><div class="reading"><span id="lv">35</span><small> %</small></div><input id="left" type="range" min="0" max="100" value="35"></div><div class="dial"><label for="right">HØYRE HJUL</label><div class="reading"><span id="rv">35</span><small> %</small></div><input id="right" type="range" min="0" max="100" value="35"></div><div class="dial"><label for="angle">ROTASJON</label><div class="reading"><span id="av">0</span><small> °</small></div><input id="angle" type="range" min="0" max="90" value="0"></div></div><div class="quick"><button class="active" data-preset="35,35,0">RETT</button><button data-preset="60,35,70">VENSTRE</button><button data-preset="35,60,70">HØYRE</button></div><div class="commands"><button class="go" id="start">▶ START</button><button class="halt" id="stop">■ STOPP</button></div><div class="foot" id="status">SIMULERING · Ingen ESP32-tilkobling eller motorstyring</div></section></div><script>
const $=id=>document.getElementById(id);let running=false,progress=0,prev=0;
function sync(){let l=+$('left').value,r=+$('right').value,a=+$('angle').value;$('lv').textContent=l;$('rv').textContent=r;$('av').textContent=a;$('leftRead').textContent=l+'%';$('rightRead').textContent=r+'%';$('angleRead').textContent=a+'°';let d=(r-l)*Math.sin(a*Math.PI/180);$('shot').textContent=Math.abs(d)<2?'Rett skudd':d>0?'Høyreskru':'Venstreskru';$('path').setAttribute('d','M200 270 Q'+(200-d*1.4)+' 160 '+(330-d*2)+' '+(120+d*.6));$('machine').style.transform='translateX(-50%) rotate('+((a-0)*.1)+'deg)'}
['left','right','angle'].forEach(id=>$(id).addEventListener('input',()=>{document.querySelectorAll('[data-preset]').forEach(b=>b.classList.remove('active'));sync()}));
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let v=b.dataset.preset.split(',');['left','right','angle'].forEach((id,i)=>$(id).value=v[i]);document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('active',x===b));sync()});
$('start').onclick=()=>{running=true;progress=0;$('mode').textContent='DEMO AKTIV';$('status').textContent='● DEMO AKTIV · ingen motorstyring';$('status').classList.add('running')};$('stop').onclick=()=>{running=false;progress=0;$('mode').textContent='MANUELL';$('status').textContent='SIMULERING STOPPET · ingen motorstyring';$('status').classList.remove('running')};
function animate(t){const dt=Math.min(.05,(t-prev)/1000||0);prev=t;if(running){progress=(progress+dt*.3)%1;let y=25-progress*170;let x=50+progress*40;$('ball').style.transform='translate(calc(-50% + '+x+'px),'+y+'px)';$('ball').style.opacity=String(1-progress*.7)}else{$('ball').style.transform='translateX(-50%)';$('ball').style.opacity='1'}requestAnimationFrame(animate)}sync();requestAnimationFrame(animate);
</script></body></html>
