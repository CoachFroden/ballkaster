<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04101e"><title>Ballkaster Pro — Kontroll</title><style>
:root{--bg:#020b17;--panel:#071d31;--line:#164967;--cyan:#5adfff;--text:#eefaff;--muted:#88a9bd}*{box-sizing:border-box}body{margin:0;color:var(--text);font:500 14px system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% -30%,#103d61,#020b17 65%)}button,input{font:inherit}button{cursor:pointer}.app{max-width:1180px;min-height:100dvh;margin:auto;padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}header{display:flex;justify-content:space-between;align-items:center;gap:9px}h1{margin:0;font-size:clamp(18px,2.5vw,26px);font-style:italic;letter-spacing:-.6px;text-shadow:0 0 17px #1997d27c}h1 span{font-weight:400;color:#6dd6ff}header .badge{border:1px solid #4d4d4d;background:#202a30;border-radius:30px;color:#ffce82;font-size:10px;padding:6px 8px;white-space:nowrap;font-weight:800}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f6bb60;margin-right:5px}.layout{display:grid;grid-template-columns: minmax(0,1.15fr) minmax(330px,1fr);gap:12px;flex:1;min-height:0}.visual{position:relative;overflow:hidden;min-height:310px;border-radius:17px;border:1px solid #28719c;background:linear-gradient(155deg,#0c3152,#071d31 42%,#03101c);box-shadow:inset 0 0 25px #061725,0 10px 40px #0006}.visual:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 29px,#59c9ff0b 30px),repeating-linear-gradient(90deg,transparent 0 29px,#59c9ff0b 30px);mask-image:linear-gradient(transparent 10%,black 90%)}.visual:after{content:"";position:absolute;inset:auto 0 0;height:44%;background:linear-gradient(transparent,#071c32b9);pointer-events:none}.vis-head{position:absolute;top:13px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:2;color:#a6d5e9;font-size:10px;letter-spacing:1.5px;font-weight:850}.vis-head strong{color:#b1f7d7;letter-spacing:0}.stage{position:absolute;inset:35px 5px 48px;width:calc(100% - 10px);height:calc(100% - 83px)}.vis-foot{position:absolute;bottom:13px;left:15px;right:15px;z-index:3;display:flex;gap:9px;justify-content:space-between}.metric{border:1px solid #1c668c;border-radius:8px;background:#041626bd;padding:6px 8px;min-width:0;flex:1}.metric small{display:block;font-size:9px;color:#9cbacb}.metric b{font-size:15px;color:#e2faff}.right{display:flex;flex-direction:column;gap:10px}.panel{border:1px solid #215c7d;background:linear-gradient(155deg,#0a2b46,#061a2e);border-radius:15px;padding:13px;box-shadow:inset 0 1px #3d95c433}.panel h2{font-size:11px;letter-spacing:1.4px;color:#92d9f7;margin:0 0 9px}.speeds{display:grid;grid-template-columns:1fr 1fr;gap:14px}.head{display:flex;justify-content:space-between;align-items:baseline;gap:4px}.head label{font-size:12px;font-weight:750}.head output{font-size:23px;font-weight:950;color:#b7efff;letter-spacing:-.7px}.head output small{font-size:11px}.range{display:block;width:100%;height:24px;accent-color:#32c9ff;margin:6px 0 0}.angle{display:flex;align-items:center;justify-content:space-between;gap:8px}.angle button{width:48px;height:42px;border:1px solid #3289b8;border-radius:10px;background:linear-gradient(#14537a,#092e4c);color:white;font-size:25px}.angle output{font-size:29px;font-weight:900}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.presets button{border:1px solid #247ca7;background:#0a3451;color:#d3f2ff;border-radius:10px;padding:12px 3px;font-size:11px;font-weight:850}.presets button.active{background:linear-gradient(#16685d,#0a403c);border-color:#66e9c5;color:#d1ffed}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}.actions button{border:0;border-radius:13px;padding:17px 6px;font-size:19px;font-weight:950;letter-spacing:.4px;color:white;box-shadow:inset 0 2px #ffffff4d,0 7px 18px #0008}.start{background:linear-gradient(#2de36d,#058b3c)}.stop{background:linear-gradient(#ff5d69,#b90c25)}.foot{font-size:10px;color:#9db8c8;text-align:center;margin:0}.mobile-tabs{display:none}.help{font-size:11px;color:#9dc4d7;margin:0}.state{color:#a9ffc8}.warning{color:#ffd291}
@media(max-width:720px){.app{height:100dvh;min-height:0;padding:7px 9px max(7px,env(safe-area-inset-bottom));gap:7px}header{min-height:31px}h1{font-size:19px}.mobile-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mobile-tabs button{border:1px solid #17638e;border-radius:9px;background:#082640;color:#b2d8ec;padding:8px;font-size:12px;font-weight:850}.mobile-tabs button.active{border-color:#45c9ff;background:#0a5584;color:#fff}.layout{display:flex;flex-direction:column;min-height:0}.visual{display:none;flex:1;min-height:0}.right{flex:1;min-height:0;gap:7px}.panel{padding:9px 11px}.panel h2{margin-bottom:5px;font-size:10px}.head output{font-size:20px}.range{height:20px;margin-top:1px}.angle button{height:35px}.angle output{font-size:25px}.presets button{padding:10px 2px}.actions button{padding:13px 5px}.foot{font-size:9px}.layout.view-visual .visual{display:block}.layout.view-visual .right{display:none}.layout.view-visual .stage{inset:40px 4px 58px;height:calc(100% - 98px)}}
@media(max-width:720px) and (max-height:620px){.app{gap:5px}.panel{padding:6px 9px}.panel h2{margin-bottom:2px}.range{height:15px}.angle button{height:29px}.presets button{padding:6px 2px}.actions button{padding:9px 4px}.right{gap:5px}.mobile-tabs button{padding:5px}.foot{display:none}}
@media(max-width:350px){.presets button{font-size:9px}.head label{font-size:10px}.panel{padding:8px}}
</style></head><body><div class="app"><header><h1>⚽ BALLKASTER <span>PRO</span></h1><span class="badge"><span class="dot"></span>DEMO · FRAKOBLET</span></header><nav class="mobile-tabs"><button class="active" id="controlTab">⚙ KONTROLL</button><button id="visualTab">⌁ BALLBANE</button></nav><div class="layout" id="layout">
<section class="visual"><div class="vis-head"><span>LIVE TRAJECTORY / SIMULERING</span><strong id="trajectoryName">RETT SKUDD</strong></div><svg class="stage" viewBox="0 0 660 350" preserveAspectRatio="xMidYMid meet" aria-label="Illustrasjon av ballkaster med bevegelig ballbane"><defs><radialGradient id="sky"><stop stop-color="#215a7d"/><stop offset="1" stop-color="#041628"/></radialGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#4e6c7a"/><stop offset=".23" stop-color="#132c3c"/><stop offset=".6" stop-color="#06131c"/><stop offset="1" stop-color="#526f7c"/></linearGradient><radialGradient id="tire"><stop stop-color="#223a48"/><stop offset=".62" stop-color="#0b1d29"/><stop offset=".8" stop-color="#192e3c"/><stop offset=".9" stop-color="#070f17"/><stop offset="1" stop-color="#3d6578"/></radialGradient><radialGradient id="hub"><stop stop-color="#d7f0f9"/><stop offset=".25" stop-color="#55798a"/><stop offset=".75" stop-color="#0c2736"/><stop offset="1" stop-color="#86b5c9"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter></defs><path d="M0 265 Q320 240 660 270 V350 H0Z" fill="#082b2c"/><path d="M0 285 L660 285 M0 320 L660 320" stroke="#2c7d68" opacity=".4"/><path d="M310 310 L570 260 M280 310 L100 260" stroke="#8cb9a9" opacity=".25"/><ellipse cx="166" cy="292" rx="139" ry="19" fill="#000" opacity=".6" filter="url(#shadow)"/><path d="M117 217 L81 311 M217 217 L251 311 M164 230 L164 316" stroke="#7d99a7" stroke-width="11" stroke-linecap="round"/><path d="M117 217 L81 311 M217 217 L251 311 M164 230 L164 316" stroke="#142b39" stroke-width="5"/><g transform="translate(28 65)"><path d="M42 74 L83 15 L221 15 L268 78 L249 164 L58 164Z" fill="url(#metal)" stroke="#7898a6" stroke-width="5"/><path d="M60 82 L87 32 L216 32 L248 82 L233 144 L73 144Z" fill="#071c2b" stroke="#1d526c" stroke-width="3"/><g><circle cx="109" cy="87" r="67" fill="#030a10" stroke="#6d8d9e" stroke-width="9"/><circle cx="109" cy="87" r="58" fill="url(#tire)" stroke="#101a23" stroke-width="9"/><circle cx="109" cy="87" r="37" fill="none" stroke="#274b5c" stroke-width="2" stroke-dasharray="5 9"/><circle cx="109" cy="87" r="18" fill="url(#hub)" stroke="#7ca6b7" stroke-width="2"/><circle cx="109" cy="87" r="5" fill="#081620"/></g><g><circle cx="216" cy="87" r="67" fill="#030a10" stroke="#6d8d9e" stroke-width="9"/><circle cx="216" cy="87" r="58" fill="url(#tire)" stroke="#101a23" stroke-width="9"/><circle cx="216" cy="87" r="37" fill="none" stroke="#274b5c" stroke-width="2" stroke-dasharray="5 9"/><circle cx="216" cy="87" r="18" fill="url(#hub)" stroke="#7ca6b7" stroke-width="2"/><circle cx="216" cy="87" r="5" fill="#081620"/></g><path d="M151 79 L174 79 L174 104 L151 104Z" fill="#030b12"/><path d="M55 165 L254 165" stroke="#2d7ca0" stroke-width="6"/><path d="M75 175 L238 175" stroke="#06131c" stroke-width="15"/></g><path id="trajectoryGlow" d="M205 156 Q390 15 628 112" fill="none" stroke="#00c9ff" stroke-width="12" opacity=".7" filter="url(#glow)"/><path id="trajectory" d="M205 156 Q390 15 628 112" fill="none" stroke="#83ecff" stroke-width="3" stroke-linecap="round"/><path id="trajectoryDash" d="M205 156 Q390 15 628 112" fill="none" stroke="#e2ffff" stroke-width="1" stroke-dasharray="7 9" opacity=".65"/><circle id="ball" cx="205" cy="156" r="12" fill="#f3fbff" stroke="#557988" stroke-width="2"><animate attributeName="opacity" values="1;1" dur="1s" repeatCount="indefinite"/></circle></svg><div class="vis-foot"><div class="metric"><small>VENSTRE</small><b id="visL">35 %</b></div><div class="metric"><small>HØYRE</small><b id="visR">35 %</b></div><div class="metric"><small>ROTASJON</small><b id="visA">0°</b></div></div></section>
<div class="right"><section class="panel"><h2>01 / HJULHASTIGHET</h2><div class="speeds"><div><div class="head"><label for="left">VENSTRE</label><output id="leftOut">35 <small>%</small></output></div><input class="range" type="range" min="0" max="100" value="35" id="left"></div><div><div class="head"><label for="right">HØYRE</label><output id="rightOut">35 <small>%</small></output></div><input class="range" type="range" min="0" max="100" value="35" id="right"></div></div></section>
<section class="panel"><h2>02 / ROTASJON · 0–90°</h2><div class="angle"><button id="minus" aria-label="Reduser rotasjon">−</button><output id="angleOut">0°</output><button id="plus" aria-label="Øk rotasjon">+</button></div><input class="range" type="range" min="0" max="90" value="0" id="angle"></section>
<section class="panel"><h2>03 / HURTIGVALG</h2><div class="presets"><button class="active" data-preset="35,35,0">RETT SKUDD</button><button data-preset="60,35,70">VENSTRESKRU</button><button data-preset="35,60,70">HØYRESKRU</button></div></section><div class="actions"><button class="start" id="start">▶ START</button><button class="stop" id="stop">■ STOPP</button></div><p class="foot" id="status">DEMO · Ingen tilkobling til ESP32 eller motorer</p></div></div></div>
<script>
const $=id=>document.getElementById(id);let active=false,phase=0,prev=0;
function update(){let l=+$('left').value,r=+$('right').value,a=+$('angle').value;$('leftOut').innerHTML=l+' <small>%</small>';$('rightOut').innerHTML=r+' <small>%</small>';$('angleOut').textContent=a+'°';$('visL').textContent=l+' %';$('visR').textContent=r+' %';$('visA').textContent=a+'°';let d=(r-l)*Math.sin(a*Math.PI/180);$('trajectoryName').textContent=Math.abs(d)<2?'RETT SKUDD':d>0?'HØYRESKRU':'VENSTRESKRU';let end=112+Math.max(-55,Math.min(55,d*1.1));let path='M205 156 Q390 '+(15+Math.min(55,Math.abs(d)*.8))+' 628 '+end;for(let id of ['trajectory','trajectoryGlow','trajectoryDash'])$(id).setAttribute('d',path)}
for(let id of ['left','right','angle'])$(id).addEventListener('input',()=>{document.querySelectorAll('[data-preset]').forEach(b=>b.classList.remove('active'));update()});
$('minus').onclick=()=>{$('angle').value=Math.max(0,+$('angle').value-5);update()};$('plus').onclick=()=>{$('angle').value=Math.min(90,+$('angle').value+5);update()};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let v=b.dataset.preset.split(',');['left','right','angle'].forEach((id,i)=>$(id).value=v[i]);document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('active',x===b));update()});
$('controlTab').onclick=()=>tab(false);$('visualTab').onclick=()=>tab(true);
function tab(v){$('layout').classList.toggle('view-visual',v);$('controlTab').classList.toggle('active',!v);$('visualTab').classList.toggle('active',v)}
$('start').onclick=()=>{active=true;phase=0;$('status').textContent='● DEMO AKTIV · ingen motorstyring';$('status').className='foot state'};
$('stop').onclick=()=>{active=false;phase=0;$('status').textContent='DEMO STOPPET · ingen motorstyring';$('status').className='foot warning'};
function frame(t){let dt=Math.min(.05,(t-prev)/1000||0);prev=t;if(active){phase=(phase+dt*.28)%1;let p=$('trajectory'),len=p.getTotalLength(),pt=p.getPointAtLength(phase*len);$('ball').setAttribute('cx',pt.x);$('ball').setAttribute('cy',pt.y)}else{$('ball').setAttribute('cx',205);$('ball').setAttribute('cy',156)}requestAnimationFrame(frame)}update();requestAnimationFrame(frame);
</script></body></html>
