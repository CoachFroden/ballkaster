<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061b2b"><title>Ballkaster – kontrollpanel</title><style>
*{box-sizing:border-box}html{background:#061b2b}body{margin:0;color:#f1f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% 20%,#17445b 0,#071e2e 55%,#041420 100%);min-height:100dvh}button,input{font:inherit}button{cursor:pointer}.app{width:min(1160px,100%);margin:auto;padding:20px 24px 28px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.logo{font-size:clamp(25px,4vw,39px);font-style:italic;font-weight:950;letter-spacing:-1px}.logo em{font-style:normal;color:#b8ff25}.header small{letter-spacing:4px;color:#b8cbd8;font-size:12px}.nav{display:grid;grid-template-columns:1fr 1fr .85fr;gap:10px;margin-bottom:4px}.tab{border:1px solid #62879b;background:linear-gradient(#133448,#092435);color:#e8f5fa;padding:15px 9px;border-radius:16px;font-size:15px;font-weight:850;letter-spacing:.5px;text-align:center;text-decoration:none}.tab.active{background:#baff29;color:#10220a;border-color:#d4ff8a}.stage{position:relative;min-height:390px;height:min(46vw,520px);display:flex;align-items:center;justify-content:center;overflow:hidden}.stage:before{content:"";position:absolute;inset:12% 12%;background:radial-gradient(ellipse,#2e657d55,transparent 67%);pointer-events:none}.stage svg{position:relative;width:100%;height:100%;overflow:visible}.stage svg #machineAssembly{transform-origin:450px 300px;transition:transform .35s ease}.stage.side svg #machineAssembly{transform:rotate(-90deg) scale(.86)}.stage.side svg #headUnit{transform:rotate(0deg)}.angle{position:absolute;bottom:5px;right:12px;color:#a8c3d1;font-size:12px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.control{background:linear-gradient(160deg,#0e2b3e,#061b2b);border:1px solid #50738a;border-radius:17px;padding:16px 20px;box-shadow:0 10px 25px #0003}.control label{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#baff29;font-weight:850;font-size:13px;letter-spacing:.7px}.control output{display:block;font-size:clamp(30px,4vw,47px);font-weight:900;text-align:center;margin:2px 0;color:#f7fbff;font-variant-numeric:tabular-nums}.control input{width:100%;accent-color:#baff29;cursor:pointer;height:24px}.ends{display:flex;justify-content:space-between;color:#a9c2d0;font-size:10px}.bottom{display:grid;grid-template-columns:1fr .8fr 1fr;gap:14px;margin-top:15px;align-items:stretch;background:#092334;border:1px solid #456c82;border-radius:17px;padding:13px}.action{border:0;border-radius:15px;font-size:clamp(17px,2.4vw,25px);font-weight:950;padding:16px 8px}.start{background:linear-gradient(#c4ff3a,#a9f71e);color:#0d2104}.stop{background:linear-gradient(#ff6565,#e92f37);color:#290708}.action:disabled{opacity:.45;cursor:default}.status{border:1px solid #56788c;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:18px;font-weight:850}.status small{font-size:10px;color:#b0c6d2;font-weight:500}.dot{display:inline-block;background:#9bafbb;border-radius:50%;width:11px;height:11px;margin-right:7px}.status.running .dot{background:#baff29;box-shadow:0 0 15px #baff29}.foot{margin:12px 0 0;color:#9db7c7;font-size:11px;text-align:center}@media(max-width:680px){.app{padding:10px 11px 18px}.header{margin-bottom:8px}.logo{font-size:24px}.header small{font-size:9px;letter-spacing:1.5px}.nav{gap:5px}.tab{padding:10px 3px;border-radius:11px;font-size:11px}.stage{height:34vh;min-height:190px;max-height:320px}.controls{gap:6px}.control{padding:9px 7px;border-radius:11px}.control label{font-size:10px;letter-spacing:0;min-height:25px}.control output{font-size:27px}.ends{font-size:8px}.bottom{gap:6px;padding:7px;margin-top:9px;border-radius:12px}.action{font-size:15px;padding:12px 3px;border-radius:10px}.status{font-size:12px}.status small{font-size:8px}.foot{font-size:9px}.angle{font-size:9px}}@media(max-width:390px){.tab{font-size:10px}.control label{font-size:9px}.control output{font-size:23 </style></head><body><div class="app"><header class="header"><div class="logo">BALLKASTER <em>//</em></div><small>KONTROLLPANEL</small></header><nav class="nav"><button class="tab active" id="topBtn" type="button">◉ TOPVIEW</button><button class="tab" id="sideBtn" type="button">▣ SIDEVIEW</button><a class="tab" href="ballbane.html">⚽ BALLBANE</a></nav><section class="stage" id="stage"><svg id="machine" viewBox="0 0 900 520" role="img" aria-label="Illustrert ballkaster med aluminiumsbraketter, to hjul og motorer"><defs><linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#e7f1f4"/><stop offset=".22" stop-color="#7e97a5"/><stop offset=".48" stop-color="#d1e0e8"/><stop offset=".78" stop-color="#516d7d"/><stop offset="1" stop-color="#b8cbd6"/></linearGradient><linearGradient id="rim" x2="1" y2="1"><stop stop-color="#f1f5f6"/><stop offset=".35" stop-color="#9cb0bb"/><stop offset=".65" stop-color="#4b6575"/><stop offset="1" stop-color="#e6eef0"/></linearGradient><linearGradient id="rubber" x2="0" y2="1"><stop stop-color="#424d55"/><stop offset=".4" stop-color="#10171d"/><stop offset="1" stop-color="#323d45"/></linearGradient><linearGradient id="motor" x2="1" y2=".3"><stop stop-color="#e0ebee"/><stop offset=".4" stop-color="#7f9aa9"/><stop offset="1" stop-color="#3b5362"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-opacity=".45"/></filter></defs><g id="machineAssembly" filter="url(#shadow)"><g id="frame"><path d="M390 315V448Q390 466 408 466H493Q510 466 510 448V315" fill="none" stroke="#425a68" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 315V448Q390 466 408 466H493Q510 466 510 448V315" fill="none" stroke="url(#metal)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><rect x="385" y="280" width="130" height="160" rx="20" fill="url(#metal)" stroke="#b9d0d9" stroke-width="4"/><path d="M400 296V421" stroke="#f4f8f9" stroke-width="3" opacity=".45"/><circle cx="450" cy="329" roke="#67717a" stroke-width="2" opacity=".5"/><g stroke="#111e27" stroke-width="6"><path d="M-65 5l-9 14m10 2l-9 14"/><path d="M-51 5l-9 14m10 2l-9 14"/><path d="M-37 5l-9 14m10 2l-9 14"/><path d="M-23 5l-9 14m10 2l-9 14"/><path d="M-9 5l-9 14m10 2l-9 14"/><path d="M5 5l-9 14m10 2l-9 14"/><path d="M19 5l-9 14m10 2l-9 14"/><path d="M33 5l-9 14m10 2l-9 14"/><path d="M47 5l-9 14m10 2l-9 14"/><path d="M61 5l-9 14m10 2l-9 14"/></g><ellipse rx="78" ry="43" fill="#121b24" stroke="#77838d" stroke-width="3"/><ellipse rx="61" ry="33" fill="url(#rim)" stroke="#d8e2e9" stroke-width="3"/><ellipse rx="48" ry="25" fill="#182631" stroke="#748996" stroke-width="3"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(0)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(60)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(120)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(180)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(240)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(300)"/><ellipse rx="12" ry="10" fill="#c7d5de" stroke="#415667" stroke-width="5"/><circle r="4" fill="#1b2834"/></g><g transform="translate(611 130)"><ellipse cy="10" rx="81" ry="46" fill="#030a0f" opacity=".6"/><rect x="-78" y="-6" width="156" height="53" rx="21" fill="url(#rubber)" stroke="#56616a" stroke-width="2"/><path d="M-72 8H72M-73 22H73M-66 37H66" stroke="#67717a" stroke-width="2" opacity=".5"/><g stroke="#111e27" stroke-width="6"><path d="M-65 5l-9 14m10 2l-9 14"/><path d="M-51 5l-9 14m10 2l-9 14"/><path d="M-37 5l-9 14m10 2l-9 14"/><path d="M-23 5l-9 14m10 2l-9 14"/><path d="M-9 5l-9 14m10 2l-9 14"/><path d="M5 5l-9 14m10 2l-9 14"/><path d="M19 5l-9 14m10 2l-9 14"/><path d="M33 5l-9 14m10 2l-9 14"/><path d="M47 5l-9 14m10 2l-9 14"/><path d="M61 5l-9 14m10 2l-9 14"/></g><ellipse rx="78" ry="43" fill="#121b24" stroke="#77838d" stroke-width="3"/><ellipse rx="61" ry="33" fill="url(#rim)" stroke="#d8e2e9" stroke-width="3"/><ellipse rx="48" ry="25" fill="#182631" stroke="#748996" stroke-width="3"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(0)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(60)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(120)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(180)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(240)"/><path d="M-12-6L-13-21L13-21L12-6Z" fill="url(#rim)" transform="rotate(300)"/><ellipse rx="12" ry="10" fill="#c7d5de" stroke="#415667" stroke-width="5"/><circle r="4" fill="#1b2834"/></g></g><g id="axle"><path d="M449 329L484 329" stroke="#b7cad5" stroke-width="18" stroke-linecap="round"/><ellipse cx="486" cy="329" rx="8" ry="10" fill="#e4edf1"/></g></g></svg><span class="angle" id="angleText">HJULSTILLING 0°</span></section><section class="controls"><div class="control"><label for="left">◉ VENSTRE HJUL</label><output id="leftValue">50 %</output><input id="left" type="range" min="0" max="100" value="50" aria-label="Venstre hjul hastighet"><div class="ends"><span>0 %</span><span>100 %</span></div></div><div class="control"><label for="right">◉ HØYRE HJUL</label><output id="rightValue">50 %</output><input id="right" type="range" min="0" max="100" value="50" aria-label="Høyre hjul hastighet"><div class="ends"><span>0 %</span><span>100 %</span></div></div><div class="control"><label for="rotation">◺ HJULSTILLING</label><output id="rotationValue">0°</output><input id="rotation" type="range" min="0" max="90" value="0" aria-label="Hjulstilling"><div class="ends"><span>0° horisontal</span><span>90° vertikal</span></div></div></section><section class="bottom"><button class="action start" id="startBtn" type="button">▶ START</button><div class="status" id="runState" role="status" aria-live="polite"><span><i class="dot"></i><span id="runText">KLAR</span></span><small>Demo – ingen motorstyring</small></div><button class="action stop" id="stopBtn" type="button" disabled>■ STOPP</button></section><p class="foot">Illustrert aluminiumsmodell · Kontroller er demonstrasjon og ikke koblet til ESP32 · Fysisk nødstopp kreves før virkelig drift</p></div><script>
const $=id=>document.getElementById(id);let side=false,running=false;
function update(){for(const id of ['left','right'])$(id+'Value').textContent=$(id).value+' %';const a=+$('rotation').value;$('rotationValue').textContent=a+'°';$('angleText').textContent='HJULSTILLING '+a+'°';$('headUnit').setAttribute('transform','rotate('+a+' 450 290)');try{localStorage.setItem('bkSettings',JSON.stringify({left:+$('left').value,right:+$('right').value,rotation:a}))}catch{}}
function setView(s){side=s;$('stage').classList.toggle('side',s);$('topBtn').classList.toggle('active',!s);$('sideBtn').classList.toggle('active',s)}
function setRunning(v){running=v;$('startBtn').disabled=v;$('stopBtn').disabled=!v;$('runState').classList.toggle('running',v);$('runText').textContent=v?'DEMO AKTIV':'KLAR'}
for(const id of ['left','right','rotation'])$(id).addEventListener('input',update);$('topBtn').onclick=()=>setView(false);$('sideBtn').onclick=()=>setView(true);$('startBtn').onclick=()=>setRunning(true);$('stopBtn').onclick=()=>setRunning(false);
try{const v=JSON.parse(localStorage.getItem('bkSettings'));if(v)for(const id of ['left','right','rotation'])if(Number.isFinite(v[id]))$(id).value=Math.max(0,Math.min(id==='rotation'?90:100,v[id]))}catch{}update();
</script></body></html>
