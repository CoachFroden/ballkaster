tate(315)" stroke="#56616a" stroke-width="3"/><path d="M-5-90l9 13" transform="rotate(337.5)" stroke="#56616a" stroke-width="3"/></g></g><g id="sideDrawing" style="display:none"><g transform="translate(450 119)"><rect x="-37" y="-91" width="74" height="182" rx="17" fill="url(#tread)" stroke="#56616a" stroke-width="3"/><g id="leftTread" class="treadPattern"><path d="M-34 -76l26 -11 M34 -76l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 -58l26 -11 M34 -58l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 -40l26 -11 M34 -40l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 -22l26 -11 M34 -22l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 -4l26 -11 M34 -4l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 14l26 -11 M34 14l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 32l26 -11 M34 32l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 50l26 -11 M34 50l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 68l26 -11 M34 68l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M0-84V84" stroke="#080c10" stroke-width="5"/></g></g><g transform="translate(450 413)"><rect x="-37" y="-91" width="74" height="182" rx="17" fill="url(#tread)" stroke="#56616a" stroke-width="3"/><g id="rightTread" class="treadPattern"><path d="M-34 -76l26 -11 M34 -76l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 -58l26 -11 M34 -58l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 -40l26 -11 M34 -40l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 -22l26 -11 M34 -22l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 -4l26 -11 M34 -4l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 14l26 -11 M34 14l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 32l26 -11 M34 32l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 50l26 -11 M34 50l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M-34 68l26 -11 M34 68l-26 -11" stroke="#080c10" stroke-width="5" stroke-linecap="round"/><path d="M0-84V84" stroke="#080c10" stroke-width="5"/></g></g></g></svg><span class="angle" id="angleText">HJULSTILLING 0°</span></section><section class="controls"><div class="control"><label for="left">◉ VENSTRE HJUL</label><output id="leftValue">50 %</output><input id="left" type="range" min="0" max="100" value="50" aria-label="Venstre hjul hastighet"><div class="ends"><span>0 %</span><span>100 %</span></div></div><div class="control"><label for="right">◉ HØYRE HJUL</label><output id="rightValue">50 %</output><input id="right" type="range" min="0" max="100" value="50" aria-label="Høyre hjul hastighet"><div class="ends"><span>0 %</span><span>100 %</span></div></div><div class="control"><label for="rotation">◺ HJULSTILLING</label><output id="rotationValue">0°</output><input id="rotation" type="range" min="0" max="90" value="0" aria-label="Hjulstilling"><div class="ends"><span>0° horisontal</span><span>90° vertikal</span></div></div></section><section class="bottom"><button class="action start" id="startBtn" type="button">▶ START</button><div class="status" id="runState" role="status" aria-live="polite"><span><i class="dot"></i><span id="runText">KLAR</span></span><small>Demo – ingen motorstyring</small></div><button class="action stop" id="stopBtn" type="button" disabled>■ STOPP</button></section><p class="foot">2D-hjulmodell (Ø65 mm, 40 mm mellomrom) · Kontroller er demonstrasjon og ikke koblet til ESP32 · Fysisk nødstopp kreves før virkelig drift</p></div><script>const $=id=>document.getElementById(id);let side=false,running=false;
function update(){for(const id of ['left','right']){$(id+'Value').textContent=$(id).value+' %';const duration=(1.8-1.65*Number($(id).value)/100).toFixed(2)+'s';for(const suffix of ['Spin','Tread']){const el=$(id+suffix);el.style.animationDuration=duration;el.classList.toggle('running',running&&Number($(id).value)>0)}}const a=+$('rotation').value;$('rotationValue').textContent=a+'°';$('angleText').textContent='HJULSTILLING '+a+'° · SKJEMATISK';try{localStorage.setItem('bkSettings',JSON.stringify({left:+$('left').value,right:+$('right').value,rotation:a}))}catch{}}
function setView(v){side=v;$('topDrawing').style.display=v?'none':'block';$('sideDrawing').style.display=v?'block':'none';$('topBtn').classList.toggle('active',!v);$('sideBtn').classList.toggle('active',v)}
function setRunning(v){running=v;$('startBtn').disabled=v;$('stopBtn').disabled=!v;$('runState').classList.toggle('running',v);$('runText').textContent=v?'DEMO AKTIV':'KLAR';update()}
for(const id of ['left','right','rotation'])$(id).addEventListener('input',update);$('topBtn').onclick=()=>setView(false);$('sideBtn').onclick=()=>setView(true);$('startBtn').onclick=()=>setRunning(true);$('stopBtn').onclick=()=>setRunning(false);try{const v=JSON.parse(localStorage.getItem('bkSettings'));if(v)for(const id of ['left','right','rotation'])if(Number.isFinite(v[id]))$(id).value=Math.max(0,Math.min(id==='rotation'?90:100,v[id]))}catch{}update();</script></body></html>
