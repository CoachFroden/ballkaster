<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061b2b"><title>Ballkaster – kontrollpanel</title><style>
*{box-sizing:border-box}html{background:#061b2b}body{margin:0;color:#f1f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% 20%,#17445b 0,#071e2e 55%,#041420 100%);min-height:100dvh}button,input{font:inherit}button{cursor:pointer}.app{width:min(1160px,100%);margin:auto;padding:20px 24px 28px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.logo{font-size:clamp(25px,4vw,39px);font-style:italic;font-weight:950;letter-spacing:-1px}.logo em{font-style:normal;color:#b8ff25}.header small{letter-spacing:4px;color:#b8cbd8;font-size:12px}.nav{display:grid;grid-template-columns:1fr 1fr .85fr;gap:10px;margin-bottom:4px}.tab{border:1px solid #62879b;background:linear-gradient(#133448,#092435);color:#e8f5fa;padding:15px 9px;border-radius:16px;font-size:15px;font-weight:850;letter-spacing:.5px;text-align:center;text-decoration:none}.tab.active{background:#baff29;color:#10220a;border-color:#d4ff8a}.stage{position:relative;min-height:390px;height:min(46vw,520px);display:flex;align-items:center;justify-content:center;overflow:hidden}.stage:before{content:"";position:absolute;inset:12% 12%;background:radial-gradient(ellipse,#2e657d55,transparent 67%);pointer-events:none}.stage svg{position:relative;width:100%;height:100%;overflow:visible}.stage.side svg #headUnit{transform:rotate(0deg)}.angle{position:absolute;bottom:5px;right:12px;color:#a8c3d1;font-size:12px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.control{background:linear-gradient(160deg,#0e2b3e,#061b2b);border:1px solid #50738a;border-radius:17px;padding:16px 20px;box-shadow:0 10px 25px #0003}.control label{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#baff29;font-weight:850;font-size:13px;letter-spacing:.7px}.control output{display:block;font-size:clamp(30px,4vw,47px);font-weight:900;text-align:center;margin:2px 0;color:#f7fbff;font-variant-numeric:tabular-nums}.control input{width:100%;accent-color:#baff29;cursor:pointer;height:24px}.ends{display:flex;justify-content:space-between;color:#a9c2d0;font-size:10px}.bottom{display:grid;grid-template-columns:1fr .8fr 1fr;gap:14px;margin-top:15px;align-items:stretch;background:#092334;border:1px solid #456c82;border-radius:17px;padding:13px}.action{border:0;border-radius:15px;font-size:clamp(17px,2.4vw,25px);font-weight:950;padding:16px 8px}.start{background:linear-gradient(#c4ff3a,#a9f71e);color:#0d2104}.stop{background:linear-gradient(#ff6565,#e92f37);color:#290708}.action:disabled{opacity:.45;cursor:default}.status{border:1px solid #56788c;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:18px;font-weight:850}.status small{font-size:10px;color:#b0c6d2;font-weight:500}.dot{display:inline-block;background:#9bafbb;border-radius:50%;width:11px;height:11px;margin-right:7px}.status.running .dot{background:#baff29;box-shadow:0 0 15px #baff29}.foot{margin:12px 0 0;color:#9db7c7;font-size:11px;text-align:center}@media(max-width:680px){.app{padding:10px 11px 18px}.header{margin-bottom:8px}.logo{font-size:24px}.header small{font-size:9px;letter-spacing:1.5px}.nav{gap:5px}.tab{padding:10px 3px;border-radius:11px;font-size:11px}.stage{height:34vh;min-height:190px;max-height:320px}.controls{gap:6px}.control{padding:9px 7px;border-radius:11px}.control label{font-size:10px;letter-spacing:0;min-height:25px}.control output{font-size:27px}.ends{font-size:8px}.bottom{gap:6px;padding:7px;margin-top:9px;border-radius:12px}.action{font-size:15px;padding:12px 3px;border-radius:10px}.status{font-size:12px}.status small{font-size:8px}.foot{font-size:9px}.angle{font-size:9px}}@media(max-width:390px){.tab{font-size:10px}.control label{font-size:9px}.control output{font-size:23px}.stage{height:29vh}}
.spin{transform-box:fill-box;transform-origin:center;animation:wheelSpin 1s linear infinite;animation-play-state:paused}.spin.running{animation-play-state:running}@keyframes wheelSpin{to{transform:rotate(360deg)}}#leftTilt,#rightTilt{transition:transform .18s ease}#sideMoving{transition:transform .18s ease}</style></head><body><div class="app"><header class="header"><div class="logo">BALLKASTER <em>//</em></div><small>KONTROLLPANEL</small></header><nav class="nav"><button class="tab active" id="topBtn" type="button">◉ TOPVIEW</button><button class="tab" id="sideBtn" type="button">▣ SIDEVIEW</button><a class="tab" href="ballbane.html">⚽ BALLBANE</a></nav><section class="stage" id="stage"><svg id="machine" viewBox="0 0 900 520" role="img" aria-label="Bevegelig teknisk 2D-tegning av ballkasteren"><defs><linearGradient id="alum" x1="0" x2="1" y1="0" y2=".8"><stop stop-color="#f0f5f6"/><stop offset=".25" stop-color="#879eaa"/><stop offset=".55" stop-color="#d1dfe4"/><stop offset="1" stop-color="#4a6676"/></linearGradient><linearGradient id="motorG" x2="1" y2=".2"><stop stop-color="#d5e1e6"/><stop offset=".5" stop-color="#688393"/><stop offset="1" stop-color="#243e4e"/></linearGradient></defs><g transform="translate(0 5)"><g id="topDrawing"><g id="fixedTop" transform="translate(0 -95)"><path d="M395 350V440Q395 460 415 460H485Q505 460 505 440V350" fill="none" stroke="url(#alum)" stroke-width="34" stroke-linejoin="round"/><rect x="393" y="319" width="114" height="113" rx="13" fill="url(#alum)" stroke="#d9e5ea" stroke-width="4"/><circle cx="450" cy="352" r="20" fill="#344f60" stroke="#e1ebef" stroke-width="5"/><circle cx="450" cy="352" r="9" fill="#152b39"/></g><g id="topMoving" transform="translate(450 175)"><g transform="translate(0 0)"><g transform="translate(-175 0)"><rect x="-55" y="50" width="110" height="125" rx="22" fill="url(#motorG)" stroke="#9cb5c1" stroke-width="4"/><rect x="-39" y="118" width="78" height="25" rx="5" fill="#132a38" stroke="#7895a4" stroke-width="3"/><path d="M-25 130H25" stroke="#bd8247" stroke-width="5"/><rect x="-5" y="173" width="10" height="19" rx="2" fill="#cda451"/></g><g transform="translate(175 0)"><rect x="-55" y="50" width="110" height="125" rx="22" fill="url(#motorG)" stroke="#9cb5c1" stroke-width="4"/><rect x="-39" y="118" width="78" height="25" rx="5" fill="#132a38" stroke="#7895a4" stroke-width="3"/><path d="M-25 130H25" stroke="#bd8247" stroke-width="5"/><rect x="-5" y="173" width="10" height="19" rx="2" fill="#cda451"/></g><path d="M-280 65H280Q300 65 300 45V-5Q300-25 280-25H-280Q-300-25-300-5V45Q-300 65-280 65Z" fill="url(#alum)" stroke="#e2ecee" stroke-width="5"/><path d="M-85-25Q0 28 85-25" fill="none" stroke="#1a3645" stroke-width="10"/><g transform="translate(-230 23)"><g transform="translate(0 0)"><circle r="12" fill="#506b7a" stroke="#d7e4e8" stroke-width="4"/><path d="M-5 0H5M0-5V5" stroke="#eaf2f5" stroke-width="2"/></g></g><g transform="translate(-115 23)"><g transform="translate(0 0)"><circle r="12" fill="#506b7a" stroke="#d7e4e8" stroke-width="4"/><path d="M-5 0H5M0-5V5" stroke="#eaf2f5" stroke-width="2"/></g></g><g transform="translate(115 23)"><g transform="translate(0 0)"><circle r="12" fill="#506b7a" stroke="#d7e4e8" stroke-width="4"/><path d="M-5 0H5M0-5V5" stroke="#eaf2f5" stroke-width="2"/></g></g><g transform="translate(230 23)"><g transform="translate(0 0)"><circle r="12" fill="#506b7a" stroke="#d7e4e8" stroke-width="4"/><path d="M-5 0H5M0-5V5" stroke="#eaf2f5" stroke-width="2"/></g></g><g transform="translate(-175 0)"><g class="wheelTilt" id="leftTilt"><circle r="91" fill="#121b24" stroke="#667984" stroke-width="8"/><circle r="77" fill="#222e36" stroke="#a6b7c0" stroke-width="4"/><circle r="65" fill="url(#alum)" stroke="#d8e2e6" stroke-width="4"/><circle r="52" fill="#13232e" stroke="#8fa6b3" stroke-width="3"/><g id="leftSpin" class="spin"><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(0)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(60)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(120)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(180)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(240)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(300)"/><circle r="17" fill="url(#alum)" stroke="#d9e5e9" stroke-width="3"/><circle r="6" fill="#263a46"/></g></g></g><g transform="translate(175 0)"><g class="wheelTilt" id="rightTilt"><circle r="91" fill="#121b24" stroke="#667984" stroke-width="8"/><circle r="77" fill="#222e36" stroke="#a6b7c0" stroke-width="4"/><circle r="65" fill="url(#alum)" stroke="#d8e2e6" stroke-width="4"/><circle r="52" fill="#13232e" stroke="#8fa6b3" stroke-width="3"/><g id="rightSpin" class="spin"><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(0)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(60)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(120)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(180)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(240)"/><path d="M-11-13L-19-47Q0-56 19-47L11-13Z" fill="url(#alum)" stroke="#9cb2bd" stroke-width="2" transform="rotate(300)"/><circle r="17" fill="url(#alum)" stroke="#d9e5e9" stroke-width="3"/><circle r="6" fill="#263a46"/></g></g></g></g></g></g><g id="sideDrawing" style="display:none"><g id="sideFixed"><path d="M330 140V430Q330 458 358 458H542Q570 458 570 430V140" fill="none" stroke="url(#alum)" stroke-width="34" stroke-linejoin="round"/><circle cx="450" cy="270" r="27" fill="#2b4555" stroke="#dce9ee" stroke-width="7"/><circle cx="450" cy="270" r="10" fill="#0b2332"/></g><g id="sideMoving" transform="translate(450 270)"><g transform="translate(0 -100)"><rect x="-95" y="0" width="190" height="72" rx="18" fill="url(#alum)" stroke="#dce8ed" stroke-width="4"/><rect x="-66" y="72" width="132" height="115" rx="22" fill="url(#motorG)" stroke="#abc2cb" stroke-width="4"/><rect x="-48" y="135" width="96" height="23" rx="5" fill="#17303e"/><rect x="-7" y="186" width="14" height="20" fill="#c69b47"/><g id="sideWheelTilt" transform="translate(0 -5)"><rect x="-98" y="-25" width="196" height="53" rx="19" fill="#151f27" stroke="#74858e" stroke-width="5"/><path d="M-82-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M-62-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M-42-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M-22-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M-2-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M18-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M38-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M58-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M78-20l-10 42" stroke="#3e505c" stroke-width="5"/><path d="M-88-3H88" stroke="#8d9ba4" opacity=".5" stroke-width="3"/></g></g></g><circle cx="450" cy="270" r="17" fill="url(#alum)" stroke="#f0f5f7" stroke-width="3"/></g></g></svg><span class="angle" id="angleText">HJULSTILLING 0°</span></section><section class="controls"><div class="control"><label for="left">◉ VENSTRE HJUL</label><output id="leftValue">50 %</output><input id="left" type="range" min="0" max="100" value="50" aria-label="Venstre hjul hastighet"><div class="ends"><span>0 %</span><span>100 %</span></div></div><div class="control"><label for="right">◉ HØYRE HJUL</label><output id="rightValue">50 %</output><input id="right" type="range" min="0" max="100" value="50" aria-label="Høyre hjul hastighet"><div class="ends"><span>0 %</span><span>100 %</span></div></div><div class="control"><label for="rotation">◺ HJULSTILLING</label><output id="rotationValue">0°</output><input id="rotation" type="range" min="0" max="90" value="0" aria-label="Hjulstilling"><div class="ends"><span>0° horisontal</span><span>90° vertikal</span></div></div></section><section class="bottom"><button class="action start" id="startBtn" type="button">▶ START</button><div class="status" id="runState" role="status" aria-live="polite"><span><i class="dot"></i><span id="runText">KLAR</span></span><small>Demo – ingen motorstyring</small></div><button class="action stop" id="stopBtn" type="button" disabled>■ STOPP</button></section><p class="foot">Bevegelig 2D-modell · Kontroller er demonstrasjon og ikke koblet til ESP32 · Fysisk nødstopp kreves før virkelig drift</p></div><script>const $=id=>document.getElementById(id);let side=false,running=false;
function update(){for(const id of ['left','right']){$(id+'Value').textContent=$(id).value+' %';const spin=$(id+'Spin');spin.style.animationDuration=(1.8-1.65*Number($(id).value)/100).toFixed(2)+'s';spin.classList.toggle('running',running&&Number($(id).value)>0)}const a=+$('rotation').value;$('rotationValue').textContent=a+'°';$('angleText').textContent='HJULSTILLING '+a+'°';const scale=Math.max(.12,Math.cos(a*Math.PI/180));$('leftTilt').setAttribute('transform','scale(1 '+scale+')');$('rightTilt').setAttribute('transform','scale(1 '+scale+')');$('sideMoving').setAttribute('transform','translate(450 270) rotate('+a+')');try{localStorage.setItem('bkSettings',JSON.stringify({left:+$('left').value,right:+$('right').value,rotation:a}))}catch{}}
function setView(v){side=v;$('topDrawing').style.display=v?'none':'block';$('sideDrawing').style.display=v?'block':'none';$('topBtn').classList.toggle('active',!v);$('sideBtn').classList.toggle('active',v)}
function setRunning(v){running=v;$('startBtn').disabled=v;$('stopBtn').disabled=!v;$('runState').classList.toggle('running',v);$('runText').textContent=v?'DEMO AKTIV':'KLAR';update()}
for(const id of ['left','right','rotation'])$(id).addEventListener('input',update);$('topBtn').onclick=()=>setView(false);$('sideBtn').onclick=()=>setView(true);$('startBtn').onclick=()=>setRunning(true);$('stopBtn').onclick=()=>setRunning(false);try{const v=JSON.parse(localStorage.getItem('bkSettings'));if(v)for(const id of ['left','right','rotation'])if(Number.isFinite(v[id]))$(id).value=Math.max(0,Math.min(id==='rotation'?90:100,v[id]))}catch{}update();</script></body></html>
