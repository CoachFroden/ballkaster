<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10110f"><title>Ballkaster — Launch Control</title><style>
:root{--ink:#10110f;--lime:#d7fa5e;--paper:#f1f0e9;--gray:#92948e}*{box-sizing:border-box}body{margin:0;background:#10110f;color:var(--paper);font-family:ui-sans-serif,system-ui,-apple-system,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.app{height:100dvh;min-height:580px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1440px;margin:auto;overflow:hidden}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #34372f}.brand{font-size:18px;font-weight:1000;letter-spacing:-.8px}.brand span{color:var(--lime)}.top small{font-size:10px;color:#a9aaa0;letter-spacing:1px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e0a46b;margin-right:6px}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(350px,.8fr)}.arena{min-height:0;position:relative;background:radial-gradient(ellipse at 50% 70%,#30372b,#141b18 55%,#101310 80%);overflow:hidden}.arena:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 65%,#0d100de8)}.arena canvas{width:100%;height:100%;display:block}.arena-head{position:absolute;z-index:1;left:28px;top:26px}.eyebrow{font-size:10px;letter-spacing:2.2px;color:#b2b8a6;font-weight:800}.arena-head h1{font-size:clamp(32px,5vw,74px);letter-spacing:-3px;line-height:.95;margin:10px 0 0;text-transform:uppercase;font-weight:1000}.arena-head h1 span{color:var(--lime)}.arena-note{position:absolute;z-index:1;bottom:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:end;gap:10px}.arena-note span{font-size:10px;letter-spacing:1.3px;color:#b9c0b0}.arena-note b{font-size:13px;color:var(--lime)}.panel{background:#ecebe3;color:var(--ink);padding:28px;display:flex;flex-direction:column;min-height:0}.panel-title{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bfc0b6;padding-bottom:16px}.panel-title b{font-size:12px;letter-spacing:1.6px}.panel-title span{font-size:11px;font-weight:850;color:#686b62}.controls{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:12px}.control{border-bottom:1px solid #c4c5bb;padding:12px 0 15px}.control-top{display:flex;align-items:baseline;justify-content:space-between}.control label{font-size:12px;font-weight:900;letter-spacing:1px}.value{font-size:40px;font-weight:1000;letter-spacing:-2px;font-variant-numeric:tabular-nums}.value small{font-size:15px;letter-spacing:0}.adjust{display:flex;align-items:center;gap:14px;margin-top:7px}.adjust button{border:1px solid #a9aca0;border-radius:50%;background:transparent;color:#141712;width:34px;height:34px;font-size:22px;flex-shrink:0}.adjust input{flex:1;min-width:0;accent-color:#272c1a;height:20px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.presets button{padding:13px 3px;background:transparent;border:1px solid #b4b7a9;border-radius:4px;color:#24271e;font-size:11px;font-weight:900}.presets button.active{background:#171b12;color:#d7fa5e;border-color:#171b12}.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:14px}.actions button{border:0;border-radius:5px;padding:20px 5px;font-size:18px;font-weight:1000;letter-spacing:1px}.go{background:#c8f044;color:#12170a}.stop{background:#252924;color:#f1f0e9}.fineprint{font-size:10px;color:#74776d;text-align:center;margin-top:10px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #333a31;padding:9px 24px;color:#8e998e;font-size:10px;letter-spacing:1px}.bottom strong{color:#d4e2cb}.mobile-label{display:none}
@media(max-width:760px){.app{grid-template-rows:49px minmax(0,1fr) 22px;min-height:540px}.top{height:49px;padding:0 15px}.brand{font-size:16px}.top small{font-size:9px}.main{display:flex;flex-direction:column}.arena{height:39%;min-height:0;flex-shrink:0}.arena-head{top:15px;left:17px}.arena-head h1{font-size:clamp(27px,9vw,47px);letter-spacing:-1.6px;margin-top:5px}.arena-note{left:17px;right:17px;bottom:12px}.arena-note span{font-size:8px}.arena-note b{font-size:11px}.panel{flex:1;padding:10px 15px 8px}.panel-title{padding-bottom:6px}.panel-title b,.panel-title span{font-size:10px}.controls{gap:0}.control{padding:3px 0 5px}.control label{font-size:10px}.value{font-size:26px;letter-spacing:-1px}.value small{font-size:11px}.adjust{margin-top:0;gap:9px}.adjust button{width:27px;height:27px;font-size:19px}.adjust input{height:16px}.presets{gap:6px}.presets button{padding:7px 2px;font-size:10px}.actions{margin-top:7px}.actions button{padding:11px 3px;font-size:15px}.fineprint{font-size:9px;margin-top:5px}.bottom{padding:2px 15px;font-size:8px}.mobile-label{display:inline}}
@media(max-width:760px) and (max-height:700px){.arena{height:30%}.arena-head h1{font-size:26px}.panel{padding-top:6px}.panel-title{padding-bottom:4px}.control{padding:1px 0 3px}.value{font-size:23px}.adjust button{height:24px;width:24px}.presets button{padding:5px 2px}.actions button{padding:8px 3px}.fineprint{margin-top:2px}}
</style></head><body><div class="app"><header class="top"><div class="brand">BALLKASTER<span> / 01</span></div><small><i class="status-dot"></i>OFFLINE · SIMULERING</small></header><main class="main"><section class="arena"><div class="arena-head"><div class="eyebrow">TRAJECTORY LAB / LIVE PREVIEW</div><h1 id="shot">RETT<br><span>SKUDD.</span></h1></div><canvas id="scene" aria-label="Animasjon av illustrativ ballbane sett ovenfra"></canvas><div class="arena-note"><span>TOPPERSPEKTIV · IKKE FYSISK BEREGNET</span><b id="motion">KLAR FOR DEMO</b></div></section><section class="panel"><div class="panel-title"><b>UTSKYTNINGSKONTROLL</b><span>MANUELL / 001</span></div><div class="controls"><div class="control"><div class="control-top"><label for="left">01 / VENSTRE HJUL</label><div class="value"><span id="lv">35</span><small>%</small></div></div><div class="adjust"><button data-step="left,-5" aria-label="Reduser venstre hjul">−</button><input id="left" type="range" min="0" max="100" value="35"><button data-step="left,5" aria-label="Øk venstre hjul">+</button></div></div><div class="control"><div class="control-top"><label for="right">02 / HØYRE HJUL</label><div class="value"><span id="rv">35</span><small>%</small></div></div><div class="adjust"><button data-step="right,-5" aria-label="Reduser høyre hjul">−</button><input id="right" type="range" min="0" max="100" value="35"><button data-step="right,5" aria-label="Øk høyre hjul">+</button></div></div><div class="control"><div class="control-top"><label for="angle">03 / ROTASJON</label><div class="value"><span id="av">0</span><small>°</small></div></div><div class="adjust"><button data-step="angle,-5" aria-label="Reduser rotasjon">−</button><input id="angle" type="range" min="0" max="90" value="0"><button data-step="angle,5" aria-label="Øk rotasjon">+</button></div></div><div class="presets"><button class="active" data-preset="35,35,0">RETT</button><button data-preset="60,35,70">VENSTRE</button><button data-preset="35,60,70">HØYRE</button></div></div><div class="actions"><button class="go" id="start">▶ START DEMO</button><button class="stop" id="stop">■ STOPP</button></div><div class="fineprint" id="status">Ingen motorer tilkoblet. Dette er kun en interaktiv prototype.</div></section></main><footer class="bottom"><span>BK / LAUNCH CONTROL</span><strong>ESP32: IKKE TILKOBLET</strong></footer></div><script>
const $=id=>document.getElementById(id),c=$('scene'),ctx=c.getContext('2d');let run=false,progress=0,last=0;
function sync(){let l=+$('left').value,r=+$('right').value,a=+$('angle').value;$('lv').textContent=l;$('rv').textContent=r;$('av').textContent=a;let d=(r-l)*Math.sin(a*Math.PI/180);$('shot').innerHTML=Math.abs(d)<2?'RETT<br><span>SKUDD.</span>':d>0?'HØYRE<br><span>SKRU.</span>':'VENSTRE<br><span>SKRU.</span>'}
['left','right','angle'].forEach(id=>$(id).addEventListener('input',()=>{document.querySelectorAll('[data-preset]').forEach(b=>b.classList.remove('active'));sync()}));
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{let [id,n]=b.dataset.step.split(',');$(id).value=Math.min(+( $(id).max),Math.max(0,+$(id).value+(+n)));document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('active'));sync()});
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let values=b.dataset.preset.split(',');['left','right','angle'].forEach((id,i)=>$(id).value=values[i]);document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('active',x===b));sync()});
$('start').onclick=()=>{run=true;progress=0;$('motion').textContent='DEMO AKTIV';$('status').textContent='Animasjon aktiv · ingen signaler sendes til maskinen'};$('stop').onclick=()=>{run=false;progress=0;$('motion').textContent='DEMO STOPPET';$('status').textContent='Simulering stoppet · ingen motorstyring'};
function resize(){let b=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(b.width*d);c.height=Math.round(b.height*d);ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();
function render(t){let dt=Math.min(.06,(t-last)/1000||0);last=t;let w=c.clientWidth,h=c.clientHeight,scale=Math.min(w/450,h/330),l=+$('left').value,r=+$('right').value,a=+$('angle').value,curve=(r-l)*Math.sin(a*Math.PI/180);ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w*.5,h*.7);ctx.scale(scale,scale);
ctx.strokeStyle='#d7fa5e19';ctx.lineWidth=1;for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(i*36,-600);ctx.lineTo(i*36,300);ctx.stroke()}for(let y=-500;y<=300;y+=36){ctx.beginPath();ctx.moveTo(-800,y);ctx.lineTo(800,y);ctx.stroke()}
ctx.strokeStyle='#d7fa5e45';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,82,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,145,0,Math.PI*2);ctx.stroke();
ctx.save();ctx.translate(0,45);ctx.fillStyle='#151b15';ctx.strokeStyle='#c3cbb2';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-59,-26,118,57,10);ctx.fill();ctx.stroke();ctx.fillStyle='#3c4737';ctx.fillRect(-23,-41,46,26);
for(let x of [-62,62]){ctx.fillStyle='#090e0b';ctx.beginPath();ctx.arc(x,0,37,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c4d2a1';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,0,27,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#b5c3ac';ctx.beginPath();ctx.arc(x,0,7,0,Math.PI*2);ctx.fill()}
ctx.restore();
const path=new Path2D();path.moveTo(0,-6);path.bezierCurveTo(curve*1.8,-95,curve*3,-170,curve*4.5,-320);ctx.strokeStyle='#d7fa5e30';ctx.lineWidth=11;ctx.stroke(path);ctx.strokeStyle='#d7fa5e';ctx.lineWidth=2;ctx.setLineDash([5,8]);ctx.stroke(path);ctx.setLineDash([]);
if(run){progress=(progress+dt*(.28+(l+r)/300))%1;let p=progress,q=1-p,x=3*q*q*p*(curve*1.8)+3*q*p*p*(curve*3)+p*p*p*(curve*4.5),y=q*q*q*(-6)+3*q*q*p*(-95)+3*q*p*p*(-170)+p*p*p*(-320);ctx.fillStyle='#d7fa5e';ctx.shadowColor='#d7fa5e';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}else{ctx.fillStyle='#d7fa5e';ctx.beginPath();ctx.arc(0,-6,7,0,Math.PI*2);ctx.fill()}ctx.restore();requestAnimationFrame(render)}sync();requestAnimationFrame(render);
</script></body></html>
